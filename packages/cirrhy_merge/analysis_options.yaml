include: package:lints/recommended.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    prefer_final_locals: true
    unawaited_futures: true
    # The repository's fields are private but its constructor parameters are
    # part of the API; an initializing formal would drag the underscore into
    # the call site.
    prefer_initializing_formals: false
